[package]
name = "villain-layer"
version = "0.1.0"
description = "Villain Layer - an agent development environment"
authors = ["Code Villain"]
edition = "2021"

[lib]
name = "villain_layer_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"

serde = { version = "1", features = ["derive"] }
serde_json = "1"

tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net"] }
axum = "0.8"
portable-pty = "0.9"

reqwest = { version = "0.13", default-features = false, features = ["json", "query", "rustls", "rustls-native-certs", "http2", "charset", "system-proxy"] }

keyring = "4"

thiserror = "2"
anyhow = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
base64 = "0.22"
parking_lot = "0.12"
libc = "0.2"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
