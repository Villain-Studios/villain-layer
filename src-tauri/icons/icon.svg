  <!-- Villain Layer's icon: three layers, the top one with a villain's eyes.
       Colours are the app's own accent, #a78bfa, on its background, #0c0c11 (src/styles.css).
       Regenerate the app's icons with `bun tauri icon src-tauri/icons/icon.svg`. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#23203a"/>
      <stop offset="1" stop-color="#0c0c11"/>
    </linearGradient>
    <radialGradient id="glow" cx="512" cy="410" r="420" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#a78bfa" stop-opacity="0.28"/>
      <stop offset="1" stop-color="#a78bfa" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="face" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#d6caff"/>
      <stop offset="1" stop-color="#a78bfa"/>
